# Local nginx for the app. A front reverse proxy terminates TLS and proxies here on :80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name job.tuxvador.fr _;

    client_max_body_size 2m;

    location /static/ {
        alias /opt/jobs-app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # keep what the front proxy sent (https), don't overwrite with this hop's http
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/jobs-app.access.log;
    error_log  /var/log/nginx/jobs-app.error.log;
}
