<!doctype html>
<html lang="{{ g.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ _('Offres') }}{% endblock %} · job.tuxvador.fr</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>
{% from "_macros.html" import langswitch with context %}
{% if g.user and not popup %}
<header class="top">
  <a class="brand" href="{{ url_for('dashboard') }}">{{ _("Recherche d'emploi") }}</a>
  <nav class="nav">
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if nav == 'jobs' }}">{{ _('Offres') }}</a>
    <a href="{{ url_for('search_page') }}" class="{{ 'on' if nav == 'search' }}">{{ _('Recherche') }}</a>
    {% if g.user.is_admin %}<a href="{{ url_for('admin_users') }}" class="{{ 'on' if nav == 'admin' }}">{{ _('Admin') }}</a>{% endif %}
    <a href="{{ url_for('account') }}" class="{{ 'on' if nav == 'account' }}">{{ g.user.username }}</a>
  </nav>
  {{ langswitch() }}
  <form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="btn ghost" type="submit">{{ _('Déconnexion') }}</button>
  </form>
</header>
{% endif %}
{% block body %}{% endblock %}
</body>
</html>
